<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

<body>

    <h1>红利低波策略选股 🧧</h1>
    <table id="tbl" class="display" style="width:100%">
        <thead><tr><th>股票代码</th><th>股票名称</th><th>最新价(元)</th><th>市盈率(PE)</th><th>ROE(%)</th><th>3年平均ROE(%)</th><th>股息率(%)</th><th>总市值(亿元)</th><th>120日均价(元)</th><th>买入点(元)</th><th>卖出点(元)</th></tr></thead>
        <tbody></tbody>
    </table>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="data/data.js"></script>
    <script>
        const tbl = $('#tbl').DataTable({
            data: window.STOCK_DATA,
            columns: [
                        { data: '股票代码' },
                        { data: '股票名称' },
                        { data: '最新价(元)', render: v => '¥' + v.toFixed(2) },
                        { data: '市盈率(PE)', render: v => v.toFixed(2) },
                        { data: 'ROE(%)', render: v => v.toFixed(2) + '%' },
                        { data: '3年平均ROE(%)', render: v => v.toFixed(2) + '%' },
                        { data: '股息率(%)', render: v => (v * 100).toFixed(2) + '%' },
                        { data: '总市值(亿元)', render: v => v.toFixed(1) + '亿' },
                        { data: '120日均价(元)', render: v => '¥' + v.toFixed(2) },
                        { data: '买入点(元)', render: v => '¥' + v.toFixed(2) },
                        { data: '卖出点(元)', render: v => '¥' + v.toFixed(2) },
                    ],
                    order: [[6, 'desc']],
                    pageLength: 26,
                    language: {
                        "emptyTable": "暂无数据",
                        "info": "显示第 _START_ 至 _END_ 项结果，共 _TOTAL_ 项",
                        "infoEmpty": "显示第 0 至 0 项结果，共 0 项",
                        "infoFiltered": "(由 _MAX_ 项结果过滤)",
                        "lengthMenu": "显示 _MENU_ 项结果",
                        "loadingRecords": "加载中...",
                        "processing": "处理中...",
                        "search": "搜索:",
                        "zeroRecords": "没有匹配结果",
                        "paginate": { "first": "首页", "last": "末页", "next": "下页", "previous": "上页" },
                        "aria": { "sortAscending": ": 以升序排列此列", "sortDescending": ": 以降序排列此列" }
                    },
                });
    </script>
</body>
</html>
