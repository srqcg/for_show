<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的小站</title>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <style>
        body { font-family: sans-serif; max-width: 960px; margin: 40px auto; padding: 0 24px; line-height: 1.6; }
        h1 { color: #333; }
        hr { margin: 24px 0; }
    </style>
</head>
<body>
    <h1>你好 👋</h1>
    <p>这是从 <code>data.json</code> 加载的示例表格（支持排序、搜索、分页）。</p>
    <hr>

    <table id="tbl" class="display" style="width:100%">
        <thead><tr><th>日期</th><th>商品</th><th>数量</th><th>单价</th><th>金额</th></tr></thead>
        <tbody></tbody>
    </table>

    <hr>
    <p><small>纯静态，GitHub Pages 托管。</small></p>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script>
        fetch('data/data.json')
            .then(r => r.json())
            .then(data => {
                const tbl = $('#tbl').DataTable({
                    data,
                    columns: [
                        { data: '日期' },
                        { data: '商品' },
                        { data: '数量' },
                        { data: '单价', render: v => '¥' + v.toFixed(2) },
                        { data: '金额', render: v => '¥' + v.toFixed(2) },
                    ],
                    order: [[0, 'desc']],
                    pageLength: 10,
                    language: { url: '//cdn.datatables.net/plug-ins/1.13.6/i18n/zh-HANS.json' },
                });
            });
    </script>
</body>
</html>
