<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>JS 入门示例</title>
</head>
<body>
    <h2 id="title">点按钮试试</h2>
    <button id="btn">点我</button>
    <p id="output"></p>

    <script>
        // 1. 找到页面元素
        // document.getElementById 是"去页面里找一个 id 为 XXX 的元素"
        let btn = document.getElementById('btn')    // 找到按钮
        let out = document.getElementById('output') // 找到输出文字的区域

        // 2. 定义一个函数（"一块可以反复用的代码"）
        function sayHi(name) {           // name 是参数，调用时传进来
            return '你好，' + name + '！' // return 是"把结果还回来"
        }

        // 3. 监听按钮点击
        // addEventListener 是"当 XX 事件发生时，执行这个函数"
        btn.addEventListener('click', function () {
            let msg = sayHi('皮卡丘')  // 调用函数，结果存到 msg 变量里
            out.textContent = msg       // 把 msg 的文字放到输出区域里
        })

        // 4. 变量、字符串拼接、数字运算
        let a = 10              // 定义一个变量，值是数字 10
        let b = 20              // 定义一个变量，值是数字 20
        let c = a + b           // 数字相加，c 是 30
        let s = '10' + '20'     // 字符串拼接，s 是 '1020'（不是 30）
        console.log(c, s)       // 在开发者工具的控制台里打印出来
    </script>
    <!--
    回顾：
    document.getElementById('元素id')  → 找到页面元素
    .textContent = 'xxx'               → 修改元素的文字
    function(参数) { ... return ... }  → 定义函数
    addEventListener('click', fn)      → 监听点击事件
    let 变量名 = 值                    → 存一个值
    + 对数字→加法，对字符串→拼接
    console.log()                      → 在控制台打印（按 F12 看）
    -->
</body>
</html>
